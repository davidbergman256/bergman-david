<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Photos · David Bergman</title>
    <meta name="description" content="Photos by David Bergman, drawn in characters until you look closer." />
    <link rel="canonical" href="https://bergmandavid.com/photos/" />
    <meta property="og:title" content="Photos, David Bergman" />
    <meta property="og:description" content="Things I noticed. Hover a photo to develop it." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bergmandavid.com/photos/" />
    <meta property="og:image" content="https://bergmandavid.com/assets/photo-of-the-week.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#e6e9e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1715" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/koi.svg" type="image/svg+xml" />
    <script>
      (() => {
        let t;
        try { t = localStorage.getItem("theme"); } catch {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        document.documentElement.classList.add("js");
        // If the photo script never starts, show the photos as they are.
        setTimeout(() => {
          const root = document.documentElement;
          if (!root.classList.contains("photos-live")) root.classList.remove("js");
        }, 4000);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:ital,wght@0,300..700;1,300..700&display=swap" />
    <link rel="stylesheet" href="/assets/css/site.css?v=20" />
    <script type="module" src="/assets/js/photos.js?v=20"></script>
  </head>
  <body>
    <nav class="nav" aria-label="Main">
      <a href="/">pond</a>
      <a href="/projects/">projects</a>
      <a href="/photos/" aria-current="page">photos</a>
      <a href="/blog/">blog</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.9" /><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1" /></svg>
        <svg class="moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M13.6 10.1A5.9 5.9 0 0 1 5.9 2.4a5.9 5.9 0 1 0 7.7 7.7Z" /></svg>
      </button>
    </nav>

    <main class="page">
      <header class="page-head">
        <h1 class="couplet" data-couplet aria-label="things i noticed."><span data-couplet-text>things i noticed.</span><span class="caret" aria-hidden="true"></span></h1>
        <p class="page-sub">
          <span>Photos from walks, drives, and one very still stone.</span>
          <button class="text-button" type="button" data-develop-all aria-pressed="false">develop all</button>
        </p>
      </header>

      <div class="photos">
        <figure class="photo">
          <div class="photo-frame" data-photo tabindex="0" role="button" aria-pressed="false" aria-label="Develop the photo of the week">
            <img src="/assets/photo-of-the-week.jpg" alt="A pale yellow pickup truck parked in front of gray row houses and leafy trees." width="960" height="1280" loading="lazy" decoding="async" />
            <canvas aria-hidden="true"></canvas>
          </div>
          <figcaption><span>photo of the week</span></figcaption>
        </figure>

        <figure class="photo">
          <div class="photo-frame" data-photo tabindex="0" role="button" aria-pressed="false" aria-label="Develop the photo of the road">
            <img src="/assets/photos/road.jpg" alt="A two-lane country road at dusk, seen through a windshield, with power lines and a railway crossing sign." width="1600" height="900" loading="lazy" decoding="async" />
            <canvas aria-hidden="true"></canvas>
          </div>
          <figcaption><span>the road out</span></figcaption>
        </figure>

        <figure class="photo">
          <div class="photo-frame" data-photo tabindex="0" role="button" aria-pressed="false" aria-label="Develop the photo of the crossing at night">
            <img src="/assets/photos/night.jpg" alt="Two pink energy drink cans held up at an empty crosswalk at night." width="1050" height="1400" loading="lazy" decoding="async" />
            <canvas aria-hidden="true"></canvas>
          </div>
          <figcaption><span>night crossing</span></figcaption>
        </figure>

        <figure class="photo">
          <div class="photo-frame" data-photo tabindex="0" role="button" aria-pressed="false" aria-label="Develop the photo of a stone">
            <img src="/assets/photos/stone.jpg" alt="A smooth gray-brown stone resting on a pale surface, lit from the side." width="1400" height="787" loading="lazy" decoding="async" />
            <canvas aria-hidden="true"></canvas>
          </div>
          <figcaption><span>a stone</span></figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
