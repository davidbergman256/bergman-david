<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>David Bergman</title>
    <meta name="description" content="David Bergman. Learning math and CS at MIT. Drawing, violin, and poker in between." />
    <link rel="canonical" href="https://bergmandavid.com/" />
    <meta property="og:title" content="David Bergman" />
    <meta property="og:description" content="Learning math and CS at MIT. Feed the koi while you're here." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#e6e9e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1715" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        let t;
        try { t = localStorage.getItem("theme"); } catch {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:ital,wght@0,300..700;1,300..700&display=swap" />
    <link rel="stylesheet" href="/assets/css/site.css?v=14" />
    <script type="module" src="/assets/js/pond.js?v=14"></script>
  </head>
  <body>
    <nav class="nav" aria-label="Main">
      <a href="/" aria-current="page">pond</a>
      <a href="/projects/">projects</a>
      <a href="/photos/">photos</a>
      <a href="/blog/">blog</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.9" /><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1" /></svg>
        <svg class="moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M13.6 10.1A5.9 5.9 0 0 1 5.9 2.4a5.9 5.9 0 1 0 7.7 7.7Z" /></svg>
      </button>
    </nav>

    <canvas class="pond-canvas" aria-hidden="true" data-pond></canvas>

    <dl class="pond-hud">
      <dt>koi</dt>
      <dd data-koi-count>0</dd>
      <dt>fed</dt>
      <dd data-fed-count>0</dd>
      <dt>sound</dt>
      <dd><button class="text-button" type="button" data-sound aria-pressed="false" aria-label="Sound">off</button></dd>
    </dl>
    <div class="koi-label" data-koi-label aria-hidden="true"></div>

    <main class="home">
      <section class="intro" aria-labelledby="hello">
        <p class="couplet" data-couplet aria-hidden="true"><span data-couplet-text></span><span class="caret"></span></p>
        <div class="bio">
          <p id="hello">Hi, I'm David.</p>
          <p>Currently learning math and CS at MIT.</p>
          <p>
            Previously, I worked on <a href="https://sociolaunch.com/">sociolaunch</a> and
            <a href="https://globalink1.vercel.app/">globalink</a>.
          </p>
          <p>In my free time: drawing, the violin, and poker.</p>
        </div>
        <p class="links">
          <a href="/assets/David_Bergman_Resume.pdf">resume</a> /
          <a href="https://github.com/davidbergman256">github</a> /
          <a href="https://x.com/DavidB11012">x</a> /
          <a href="https://www.linkedin.com/in/david-bergman-a36812332/">linkedin</a> /
          <a href="mailto:a@bergmandavid.com">email</a>
        </p>
      </section>
    </main>
  </body>
</html>
