<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{ include.title }} · David Bergman</title>
    <meta name="description" content="{{ include.description | strip_html | normalize_whitespace | escape }}" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <meta property="og:title" content="{{ include.title | escape }}" />
    <meta property="og:description" content="{{ include.description | strip_html | normalize_whitespace | escape }}" />
    <meta property="og:type" content="{{ include.type | default: 'website' }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ include.image | default: '/assets/photos/stone.jpg' | absolute_url }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#e6e9e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1715" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/koi.svg" type="image/svg+xml" />
    <link rel="alternate" type="application/atom+xml" title="David Bergman" href="/blog/feed.xml" />
    <script>
      (() => {
        let t;
        try { t = localStorage.getItem("theme"); } catch {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:ital,wght@0,300..700;1,300..700&display=swap" />
    <link rel="stylesheet" href="/assets/css/site.css?v=22" />
